<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Newsletter</title>
  <link rel="icon" href="https://www.jetbrains.com/favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }
    
    .text-small {
      font-size: 13px !important;
    }
  </style>
</head>
<body>

<div id="app" class="container-fluid my-4">
  <div class="row">
    <!-- Lista de Campanhas Lateral -->
    <aside class="col-md-3">
      <h2 class="text-body-tertiary mb-4 pb-2">lista de campanhas</h2>
      <div class="list-group">
        <a
          v-for="(item, index) in templates"
          :key="index"
          href="#"
          @click.prevent="selectTemplate(index)"
          :class="['list-group-item', 'list-group-item-action', 'text-truncate', 'text-small']"
        >
          <span :class="selectedIndex === index ? 'd-inline' : 'd-none'">
            <span class="bg-primary rounded-circle" style="height: 10px; width: 10px; display: inline-block;"></span>
          </span>
          {{ item.title || item.filename || 'Nova Campanha' }}
        </a>
      </div>
    </aside>
    
    <!-- Área Principal -->
    <main class="col-md-9 mt-md-0 mt-4">
      <hr class="d-md-none">
      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
        <h1 class="fs-2 fw-medium text-lowercase" style="letter-spacing: -0.5px">campanhas</h1>
        <div class="d-flex flex-wrap align-items-center gap-1">
          <button @click="createNew" type="button" class="btn btn-primary">Adicionar item</button>
          <button @click="copyHtml" type="button" class="btn btn-secondary">Copiar</button>
          <button @click="downloadHtml" type="button" class="btn btn-primary">Baixar HTML</button>
        </div>
      </div>
      
      <!-- Alertas -->
      <div v-if="alertMessage" :class="['alert', 'alert-' + alertType, 'alert-dismissible', 'fade', 'show']" role="alert">
        {{ alertMessage }}
        <button type="button" class="btn-close" @click="alertMessage = ''" aria-label="Close"></button>
      </div>
      
      <!-- Navegação por Tabs do Bootstrap 5.3 centralizada -->
      <ul class="nav nav-tabs justify-content-center mb-4" id="newsletterTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="editor-tab"
            data-bs-toggle="tab"
            data-bs-target="#editor-pane"
            type="button"
            role="tab"
            aria-controls="editor-pane"
            aria-selected="true"
          >
            Editar Conteúdo
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="preview-tab"
            data-bs-toggle="tab"
            data-bs-target="#preview-pane"
            type="button"
            role="tab"
            aria-controls="preview-pane"
            aria-selected="false"
          >
            Visualização
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="code-tab"
            data-bs-toggle="tab"
            data-bs-target="#code-pane"
            type="button"
            role="tab"
            aria-controls="code-pane"
            aria-selected="false"
          >
            Código HTML
          </button>
        </li>
      </ul>
      
      <!-- Conteúdo das Tabs -->
      <div class="tab-content" id="newsletterTabsContent">
        <!-- Aba 1: Editar Conteúdo -->
        <div class="tab-pane fade show active" id="editor-pane" role="tabpanel" aria-labelledby="editor-tab">
          <form @submit.prevent>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted mb-1" for="filename">Nome do arquivo</label>
                <input v-model="current.filename" id="filename" type="text" class="form-control" placeholder="draft.html">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted mb-1" for="preheader">Preheader</label>
                <input v-model="current.preheader" id="preheader" type="text" class="form-control" placeholder="Texto de resumo na caixa de entrada">
              </div>
              
              <div class="col-12">
                <label class="form-label text-muted mb-1" for="title">Título</label>
                <input v-model="current.title" id="title" type="text" class="form-control" placeholder="Título da matéria">
              </div>
              
              <div class="col-md-8">
                <label class="form-label text-muted mb-1" for="imageUrl">URL da imagem (banner)</label>
                <input v-model="current.imageUrl" id="imageUrl" type="url" class="form-control" placeholder="https://...">
              </div>
              <div class="col-md-4">
                <label class="form-label text-muted mb-1" for="imageAlt">Texto alternativo (alt)</label>
                <input v-model="current.imageAlt" id="imageAlt" type="text" class="form-control" placeholder="Descrição da imagem">
              </div>
              
              <div class="col-12">
                <label class="form-label text-muted mb-1" for="description">Resumo do conteúdo</label>
                <textarea v-model="current.description" id="description" class="form-control" rows="4" placeholder="Texto da matéria"></textarea>
              </div>
              
              <div class="col-md-8">
                <label class="form-label text-muted mb-1" for="articleUrl">Link do artigo</label>
                <input v-model="current.articleUrl" id="articleUrl" type="url" class="form-control" placeholder="https://...">
              </div>
              <div class="col-md-4">
                <label class="form-label text-muted mb-1" for="buttonText">Texto do botão</label>
                <input v-model="current.buttonText" id="buttonText" type="text" class="form-control" placeholder="Leia o artigo completo">
              </div>
              
              <div class="col-md-6">
                <label class="form-label text-muted mb-1" for="subscribeUrl">Link de inscrição</label>
                <input v-model="current.subscribeUrl" id="subscribeUrl" type="url" class="form-control" placeholder="https://escudo.sabara.app.br/subscribe">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted mb-1" for="unsubscribeUrl">Link de cancelamento</label>
                <input v-model="current.unsubscribeUrl" id="unsubscribeUrl" type="url" class="form-control" placeholder="https://escudo.sabara.app.br/unsubscribe">
              </div>
            </div>
          </form>
        </div>
        
        <!-- Aba 2: Visualização -->
        <div class="tab-pane fade" id="preview-pane" role="tabpanel" aria-labelledby="preview-tab">
          <div class="d-flex justify-content-end mb-3 gap-2">
            <button
              type="button"
              :class="['btn btn-sm', previewMode === 'desktop' ? 'btn-primary' : 'btn-secondary']"
              @click="previewMode = 'desktop'"
            >
              <span class="text-small">Desktop</span>
            </button>
            <button
              type="button"
              :class="['btn btn-sm', previewMode === 'mobile' ? 'btn-primary' : 'btn-secondary']"
              @click="previewMode = 'mobile'"
            >
              <span class="text-small">Mobile</span>
            </button>
          </div>
          <div class="d-flex justify-content-center p-3 border rounded bg-light">
            <iframe
              :srcdoc="compiledHtml"
              :style="{ width: previewMode === 'desktop' ? '640px' : '375px', height: '750px', border: '0', background: '#ffffff' }"
              title="Pré-visualização do e-mail"
            ></iframe>
          </div>
        </div>
        
        <!-- Aba 3: Código HTML -->
        <div class="tab-pane fade" id="code-pane" role="tabpanel" aria-labelledby="code-tab">
          <div class="d-flex justify-content-end mb-3">
            <button @click="copyHtml" type="button" class="btn btn-secondary btn-sm text-small">Copiar código</button>
          </div>
          <pre class="bg-body-secondary rounded p-3 overflow-auto" style="max-height: 550px"><code>{{ compiledHtml }}</code></pre>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>

<script>
  const {createApp} = Vue;
  
  const DEFAULT_CAMPAIGN = {
    filename: 'draft.html',
    title: 'Os seus dados eles já têm, agora eles querem acesso às suas contas: cuidado com o Phishing!',
    preheader: 'Os seus dados eles já têm, agora eles querem acesso às suas contas: cuidado com o Phishing! O Brasil enfrenta milhões de tentativas de golpes digitais todos os dias...',
    imageUrl: 'https://escudo.sabara.app.br/opengraph-phishing.png',
    imageAlt: 'Cuidado com o Phishing',
    description: 'O Brasil enfrenta milhões de tentativas de golpes digitais todos os dias, realizadas por e-mails, SMS, WhatsApp e ligações que imitam bancos, órgãos públicos e empresas conhecidas. Entenda como esses golpes funcionam e como evitar o roubo de suas informações.',
    articleUrl: 'https://escudo.sabara.app.br/seus-dados-eles-ja-tem-agora-eles-querem-acesso-as-suas-contas',
    buttonText: 'Leia o artigo completo',
    subscribeUrl: 'https://escudo.sabara.app.br/subscribe',
    unsubscribeUrl: 'https://escudo.sabara.app.br/unsubscribe'
  };
  
  createApp({
    data() {
      return {
        templates: [{...DEFAULT_CAMPAIGN}],
        selectedIndex: 0,
        current: {...DEFAULT_CAMPAIGN},
        previewMode: 'desktop',
        alertMessage: '',
        alertType: 'success'
      };
    },
    computed: {
      compiledHtml() {
        return this.buildHtml(this.current);
      }
    },
    methods: {
      showAlert(message, type = 'success') {
        this.alertMessage = message;
        this.alertType = type;
        setTimeout(() => {
          if (this.alertMessage === message) {
            this.alertMessage = '';
          }
        }, 4000);
      },
      selectTemplate(index) {
        this.selectedIndex = index;
        if (this.templates[index]) {
          this.current = {...this.templates[index]};
        }
      },
      createNew() {
        const newFilename = `campanha-${new Date().toISOString().slice(0, 10)}.html`;
        const newCamp = {
          ...DEFAULT_CAMPAIGN,
          filename: newFilename,
          title: 'Nova Campanha'
        };
        this.templates.unshift(newCamp);
        this.selectTemplate(0);
        this.showAlert('Novo item adicionado.', 'info');
      },
      copyHtml() {
        navigator.clipboard.writeText(this.compiledHtml).then(() => {
          this.showAlert('Copiado!');
        }).catch(() => {
          this.showAlert('Erro ao copiar!', 'danger');
        });
      },
      downloadHtml() {
        const filename = this.current.filename || 'newsletter.html';
        const blob = new Blob([this.compiledHtml], {type: 'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename.endsWith('.html') ? filename : `${filename}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        this.showAlert(`Download iniciado: ${a.download}`);
      },
      buildHtml(data) {
        return `
        <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
          <html xmlns="http://www.w3.org/1999/xhtml" lang="pt-BR">
          <head>
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <meta name="x-apple-disable-message-reformatting"/>
            <meta name="format-detection" content="telephone=no, date=no, address=no, email=no"/>
            <title>${data.title}</title>
            <!--[if mso]>
            <noscript>
              <xml>
                <o:OfficeDocumentSettings>
                  <o:PixelsPerInch>96</o:PixelsPerInch>
                </o:OfficeDocumentSettings>
              </xml>
            </noscript>
            <![endif]-->
            <!--[if !mso]><!-->
            <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&display=swap" rel="stylesheet"/>
            <!--<![endif]-->
            <style type="text/css">
              body, table, td, a {
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
                font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
              }
              
              .arial {
                font-family: Roboto, Helvetica, Arial, -apple-system, BlinkMacSystemFont, sans-serif;
              }
              
              table, td {
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
                border-collapse: collapse;
              }
              
              img {
                -ms-interpolation-mode: bicubic;
                border: 0;
                height: auto;
                line-height: 100%;
                outline: none;
                text-decoration: none;
              }
              
              body {
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                background-color: #ffffff;
              }
              
              @media only screen and (max-width: 620px) {
                .email-container {
                  width: 100% !important;
                  max-width: 100% !important;
                }
                
                .email-card {
                  padding: 24px 20px !important;
                }
                
                .header-col-left,
                .header-col-right {
                  display: block !important;
                  width: 100% !important;
                  text-align: left !important;
                }
                
                .header-col-right {
                  padding-top: 12px !important;
                  padding-bottom: 24px !important;
                }
                
                .email-title {
                  font-size: 30px !important;
                  line-height: 1.3 !important;
                }
                
                .email-text {
                  font-size: 16px !important;
                  line-height: 1.5 !important;
                }
                
                .email-btn {
                  display: block !important;
                  width: 100% !important;
                  box-sizing: border-box !important;
                  text-align: center !important;
                }
              }
            </style>
          </head>
          <body style="margin: 0; padding: 0; background-color: #ffffff; -webkit-font-smoothing: antialiased;">
          <!-- Preheader oculto para exibição no snippet da caixa de entrada -->
          <div style="display: none; font-size: 1px; color: #ffffff; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden; mso-hide: all;">
            ${data.preheader || data.title}
          </div>
          
          <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" style="background-color: #ffffff; margin: 0; padding: 0; width: 100%;">
            <tr>
              <td align="center" style="padding: 40px 16px;">
                <!--[if (gte mso 9)|(IE)]>
                <table align="center" border="0" cellspacing="0" cellpadding="0" width="600" style="width: 600px;">
                  <tr>
                    <td align="center" valign="top" width="600" style="width: 600px;">
                <![endif]-->
                <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" class="email-container" style="max-width: 600px; width: 100%; background-color: #e9faff; border-radius: 16px; margin: 0 auto;">
                  <tr>
                    <td class="email-card" style="padding: 32px;">
                      <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation">
                        <!-- Topo / Cabeçalho -->
                        <tr>
                          <td>
                            <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation">
                              <tr>
                                <td class="header-col-left" valign="middle" align="left" style="padding-bottom: 28px;">
                                  <a href="https://escudo.sabara.app.br" target="_blank" style="text-decoration: none; display: inline-block;">
                                    <img src="https://escudo.sabara.app.br/logo-horizontal.png" alt="Projeto Escudo" width="130" border="0" style="display: block; width: 130px; max-width: 130px; height: auto; border: 0; outline: none; text-decoration: none;"/>
                                  </a>
                                </td>
                                <td class="header-col-right" valign="middle" align="right" style="padding-bottom: 28px; font-size: 13px; line-height: 1.4; color: #626262;">
                                  <span class="arial">Recebeu o e-mail encaminhado?<br/></span>
                                  <a href="${data.subscribeUrl || 'https://escudo.sabara.app.br/subscribe'}" target="_blank" style="color: #626262; text-decoration: underline;" class="arial">Assine aqui para receber mais.</a>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                        
                        <!-- Título -->
                        <tr>
                          <td style="padding-bottom: 24px;">
                            <h1 class="email-title" style="margin: 0; font-size: 30px; line-height: 1.3; font-weight: 700; color: #2a3056; text-align: left;">
                              ${data.title}
                            </h1>
                          </td>
                        </tr>
                        
                        <!-- Imagem Principal -->
                        <tr>
                          <td style="padding-bottom: 24px;">
                            <a href="${data.articleUrl}" target="_blank" style="display: block; text-decoration: none;">
                              <img src="${data.imageUrl}" alt="${data.imageAlt}" width="536" border="0" style="display: block; width: 100%; max-width: 536px; height: auto; border-radius: 8px; border: 0; outline: none;"/>
                            </a>
                          </td>
                        </tr>
                        
                        <!-- Texto / Resumo -->
                        <tr>
                          <td style="padding-bottom: 28px;">
                            <p class="email-text arial" style="margin: 0; font-size: 17px; line-height: 1.6; color: #005a73; text-align: left;">
                              ${data.description}
                            </p>
                          </td>
                        </tr>
                        
                        <!-- Botão de Ação (Bulletproof Button) -->
                        <tr>
                          <td align="center" style="padding-bottom: 32px;">
                            <table border="0" cellspacing="0" cellpadding="0" role="presentation" align="center" style="margin: 0 auto;">
                              <tr>
                                <td align="center" bgcolor="#2a3056" style="border-radius: 3px; background-color: #2a3056;">
                                  <a class="email-btn" href="${data.articleUrl}" target="_blank" style="display: inline-block; padding: 14px; font-size: 20px; font-weight: 700; color: #ffffff; text-decoration: none; border-radius: 3px; -webkit-text-size-adjust: none; text-align: center; line-height: 20px;">
                                    <span style="vertical-align: middle; display: inline-block;">${data.buttonText || 'Leia o artigo completo'}</span>
                                    <img src="https://escudo.sabara.app.br/icon-open-in-new.png" alt="" width="18" height="18" border="0" style="vertical-align: middle; display: inline-block; margin-left: 8px; border: 0; outline: none; width: 18px; height: 18px;"/>
                                  </a>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                        
                        <!-- Rodapé -->
                        <tr>
                          <td align="center">
                            <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #626262; text-align: center;" class="arial">
                              &copy; 2026 Projeto Escudo.
                              <a href="${data.unsubscribeUrl || 'https://escudo.sabara.app.br/unsubscribe'}" target="_blank" class="arial" style="color: #626262; text-decoration: underline;">Cancelar inscrição</a>
                            </p>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
                <!--[if (gte mso 9)|(IE)]>
                </td>
                </tr>
                </table>
                <![endif]-->
              </td>
            </tr>
          </table>
          </body>
        </html>`.trim();
      }
    }
  }).mount('#app');
</script>

</body>
</html>
